<!DOCTYPE html>
<html>
<head>
    <title>Админ-панель</title>
    <style>
        body { margin:0; font-family: Arial; background: #0f172a; display: flex; }
        .sidebar { width: 260px; background: #1e293b; color: white; padding: 30px 20px; height: 100vh; }
        .sidebar h2 { color: #f1c40f; }
        .sidebar a { display: block; color: #cbd5e1; padding: 12px; text-decoration: none; }
        .sidebar a:hover { background: #334155; }
        .content { flex: 1; padding: 30px; background: #f8fafc; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚙️ Админ-панель</h2>
        <a href="#">📊 Дашборд</a>
        <a href="#">📄 Главная</a>
        <a href="#">👥 О нас</a>
        <a href="#">📞 Контакты</a>
        <a href="http://127.0.0.1:8000" style="margin-top:50px; background:#475569;">← На сайт</a>
    </div>
    <div class="content">
        <h1>Управление контентом</h1>
        <div class="card"><h3>Главная</h3><p>Фото: 3</p><button>Редактировать</button></div>
        <div class="card"><h3>О нас</h3><p>Фото: 5</p><button>Редактировать</button></div>
        <div class="card"><h3>Контакты</h3><p>Фото: 6</p><button>Редактировать</button></div>
    </div>
</body>
</html>
